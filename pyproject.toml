[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transcendence"
version = "2.0.0"
description = "A research-grade Python framework modelling recursive epistemic self-improvement."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "psutil>=5.9.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pytest-benchmark>=4.0.0",
]

[project.scripts]
transcendence = "main:run"

[tool.setuptools.packages.find]
include = ["transcendence*"]

