[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "transcendence"
version = "2.0.0"
description = "A research-grade Python framework modelling recursive epistemic self-improvement."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
transcendence = "main:run"
